{#- Placeholder product photo: a hanging bead-freshener tag in the product colour.
    This is a Jinja template, so the product name is escaped like any other. -#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="{{ product.name }}">
  <defs>
    <pattern id="plate" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#1d1a17"/><rect width="3" height="16" fill="#25211d"/>
    </pattern>
    <pattern id="beads" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#plate)"/>
  {# string #}
  <path d="M200 0 L200 62" stroke="#cfc4b5" stroke-width="3"/>
  {# the freshener: a rounded tag with a punched hole #}
  <g transform="rotate(-4 200 220)">
    <path d="M120 80 Q200 50 280 80 L300 330 Q200 360 100 330 Z" fill="{{ color }}" stroke="#000" stroke-opacity=".5" stroke-width="4"/>
    <path d="M120 80 Q200 50 280 80 L300 330 Q200 360 100 330 Z" fill="url(#beads)"/>
    <circle cx="200" cy="88" r="10" fill="#1d1a17" stroke="#000" stroke-width="3"/>
    {% if product.kind == 'blind' %}
      <text x="200" y="245" text-anchor="middle" font-family="Impact, Arial Narrow, sans-serif" font-size="120" fill="#f5ebdc">?</text>
    {% else %}
      {% for line in (product.name | replace(' (Meet Exclusive)', '') | wordwrap(11, wrapstring='\n')).split('\n')[:3] %}
        <text x="200" y="{{ 190 + loop.index0 * 44 }}" text-anchor="middle" font-family="Impact, Arial Narrow, sans-serif"
              font-size="40" letter-spacing="2" fill="#f5ebdc">{{ line | upper }}</text>
      {% endfor %}
    {% endif %}
  </g>
  {% if product.kind == 'meet' %}
    <rect x="18" y="352" width="150" height="30" fill="#e6aa1e"/><text x="93" y="373" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700">MEET ONLY</text>
  {% endif %}
  <text x="382" y="30" text-anchor="end" font-family="monospace" font-size="13" fill="#a89c8f">PLACEHOLDER</text>
</svg>
