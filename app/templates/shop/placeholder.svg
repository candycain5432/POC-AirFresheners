{#- Placeholder product photo: a hanging bead-freshener tag in the product colour.
    This is a Jinja template, so the product name is escaped like any other. -#}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="{{ product.name }}">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbf8f2"/><stop offset="1" stop-color="#e6e0d4"/>
    </radialGradient>
    <pattern id="beads" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="4.2" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  {# string #}
  <path d="M200 0 L200 62" stroke="#151413" stroke-width="2"/>
  {# the freshener: a rounded tag with a punched hole #}
  <g transform="rotate(-4 200 220)">
    <path d="M120 80 Q200 50 280 80 L300 330 Q200 360 100 330 Z" fill="{{ color }}" stroke="#000" stroke-opacity=".25" stroke-width="2"/>
    <path d="M120 80 Q200 50 280 80 L300 330 Q200 360 100 330 Z" fill="url(#beads)"/>
    <circle cx="200" cy="88" r="10" fill="#f4f1ea" stroke="#151413" stroke-width="3"/>
    {% if product.kind == 'blind' %}
      <text x="200" y="245" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif" font-weight="700" font-size="120" fill="#f5ebdc">?</text>
    {% else %}
      {% for line in (product.name | replace(' (Meet Exclusive)', '') | wordwrap(10, wrapstring='\n')).split('\n')[:3] %}
        {# Shrink long lines so they fit the tag: bold capitals are about 0.68em wide each. #}
        {% set size = [30, (150 / (0.68 * (line | length or 1))) | round(0, 'floor')] | min %}
        <text x="200" y="{{ 195 + loop.index0 * 36 }}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700"
              font-size="{{ size }}" fill="#f5ebdc">{{ line | upper }}</text>
      {% endfor %}
    {% endif %}
  </g>
  {% if product.kind == 'meet' %}
    <rect x="20" y="20" width="118" height="28" rx="14" fill="#d42a1f"/><text x="79" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#ffffff">MEET ONLY</text>
  {% endif %}
  <text x="200" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#9a938a">PLACEHOLDER PHOTO</text>
</svg>
